name: digital_twin_hybrid
version: 1.1.0
description: >
  Pipeline híbrido: usa dados reais (drone) para a estrutura principal
  (fábrica / prédio) e geração procedural para o terreno ao redor.
  Versão expandida com compressão SuperSplat e edição opcional.

inputs:
  photos_dir: ./input/drone_factory/
  terrain_prompt: "Terreno montanhoso, vegetação rasteira, estradas de terra"
  output_dir: ./outputs/factory_digital_twin/

constraints:
  engine_target: godot4
  max_polycount: 700000
  target_fps: 60
  geographic_accuracy_cm: 10

stages:
  # ----- Caminho A: estrutura principal -----
  - id: factory_sfm
    tool: colmap
    params:
      photos: "{{photos_dir}}"
      output: "{{output_dir}}/factory/colmap/"
      type: dense
      gpu: true
      matching: exhaustive

  - id: factory_splat
    tool: lichtfeld
    params:
      photos: "{{photos_dir}}"
      output: "{{output_dir}}/factory/splat/"
      iter: 30000
      sh: 3
      compress: ksplat

  # Edição visual opcional (SuperSplat serve localmente para inspeção)
  # - id: supersplat_review
  #   tool: supersplat
  #   params:
  #     action: serve
  #     port: 3000

  # ----- Caminho B: terreno procedural ao redor -----
  - id: terrain_procedural
    tool: terraforge
    params:
      biome: mountain
      size_km: 1
      resolution: 2048
      seed: 17
      features: erosion
      output: "{{output_dir}}/terrain/"

  - id: vegetation_scatter
    tool: gamefactory
    params:
      subcommand: gen_3d_scene
      prompt: "{{terrain_prompt}}"
      density: medium
      biome: temperate
      output: "{{output_dir}}/vegetation/"
      engine: godot4

  # ----- Asset processing final -----
  - id: process_factory_mesh
    tool: blender_process
    params:
      input: "{{output_dir}}/factory/colmap/dense/fused.ply"
      output: "{{output_dir}}/final/factory.glb"
      max_tris: 200000
      lod_levels: 4
      collider: trimesh

  - id: process_terrain_mesh
    tool: blender_process
    params:
      input: "{{output_dir}}/terrain/terrain.glb"
      output: "{{output_dir}}/final/terrain.glb"
      max_tris: 500000
      lod_levels: 2
      collider: trimesh

  # ----- Assembly final no Godot -----
  - id: godot_scene_assembly
    tool: terrain3d
    params:
      project: "{{output_dir}}/scene.godot/"
      biome: mountain
      size_km: 1
      resolution: 2048
      seed: 17
      output: "{{output_dir}}/final/"

  - id: validate
    tool: gltf_validator
    params:
      input: "{{output_dir}}/final/terrain.glb"

outputs:
  - "{{output_dir}}/scene.godot/"
  - "{{output_dir}}/factory/splat/scene.ksplat"
  - "{{output_dir}}/report.json"
